<?xml version="1.0" encoding="UTF-8"?>
<!-- Cytopia GlowIcon art: an isometric city block with a tower, houses and a park.
     The AmiCradle Team's own drawing; MIT, like the other Amiga files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ad05a"/>
      <stop offset="1" stop-color="#3a8a2a"/>
    </linearGradient>
    <linearGradient id="glassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad0ff"/>
      <stop offset="1" stop-color="#3a6aaa"/>
    </linearGradient>
    <linearGradient id="glassR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a90d0"/>
      <stop offset="1" stop-color="#22406a"/>
    </linearGradient>
  </defs>
  <!-- ground diamond -->
  <path d="M64 64 L122 93 L64 122 L6 93 Z" fill="url(#grass)" stroke="#1e4a14" stroke-width="3" stroke-linejoin="round"/>
  <path d="M35 78 L93 107" stroke="#6a6a6a" stroke-width="7"/>
  <path d="M35 78 L93 107" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- tower -->
  <path d="M56 92 L56 24 L72 16 L72 84 Z" fill="url(#glassL)" stroke="#142a4a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M72 84 L72 16 L88 24 L88 92 Z" fill="url(#glassR)" stroke="#142a4a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M56 24 L72 16 L88 24 L72 32 Z" fill="#cfe6ff" stroke="#142a4a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 36 L60 84 M66 33 L66 82 M78 33 L78 82 M84 36 L84 86" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <!-- house -->
  <path d="M18 92 L18 80 L30 74 L30 86 Z" fill="#f0d8a8" stroke="#5a3a1a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M30 86 L30 74 L42 80 L42 92 Z" fill="#c8a070" stroke="#5a3a1a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M16 81 L30 66 L44 81 L30 74 Z" fill="#d04030" stroke="#5a1a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- tree -->
  <rect x="98" y="88" width="4" height="10" fill="#6a3a1a"/>
  <circle cx="100" cy="84" r="9" fill="#2a9a3a" stroke="#14501a" stroke-width="2"/>
</svg>
